
<div class="w-full">
  <div class="mb-8 text-center">
    <div class="mx-auto mb-5 flex size-16 items-center justify-center rounded-2xl bg-primary text-3xl font-extrabold text-primary-foreground shadow-lg">
      S
    </div>

    <h1 class="text-3xl font-extrabold tracking-tight text-foreground">
      Welcome back
    </h1>

    <p class="mt-2 text-sm text-muted">
      Sign in to continue your learning journey.
    </p>
  </div>

  @if (errorMessage()) {
    <div
      role="alert"
      class="mb-5 rounded-xl border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="submitLogin()" class="space-y-5">

    <div>
      <label for="email" class="mb-2 block text-sm font-semibold text-foreground">
        Email address
      </label>

      <input
        id="email"
        name="email"
        type="email"
        required
        email
        autocomplete="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="you@example.com"
        class="w-full rounded-xl border border-border bg-background px-4 py-3.5 text-sm text-foreground outline-none transition placeholder:text-muted focus:border-primary">
    </div>

    <div>
      <div class="mb-2 flex items-center justify-between">
        <label for="password" class="text-sm font-semibold text-foreground">
          Password
        </label>
      </div>

      <div class="relative">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          required
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="Enter your password"
          class="w-full rounded-xl border border-border bg-background px-4 py-3.5 pr-16 text-sm text-foreground outline-none transition placeholder:text-muted focus:border-primary">

        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold text-primary">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="loading() || !email().trim() || !password()"
      class="sf-primary-button flex w-full items-center justify-center gap-2 py-3.5 disabled:cursor-not-allowed disabled:opacity-60">

      @if (loading()) {
        <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        Signing in...
      } @else {
        Sign in →
      }
    </button>
  </form>

  <div class="my-7 flex items-center gap-4">
    <div class="h-px flex-1 bg-border"></div>
    <span class="text-xs text-muted">STUDYFLOW</span>
    <div class="h-px flex-1 bg-border"></div>
  </div>

  <p class="text-center text-sm text-muted">
    Your learning journey starts with one step.
  </p>

  <p class="mt-8 text-center text-xs leading-relaxed text-muted">
    By signing in, you agree to use StudyFlow responsibly and keep your
    account credentials secure.
  </p>
</div>
<p class="mt-6 text-center text-sm text-muted">
  Don't have an account?
  <a routerLink="/auth/register"
     class="font-bold text-primary hover:underline">
    Create account
  </a>
</p>
