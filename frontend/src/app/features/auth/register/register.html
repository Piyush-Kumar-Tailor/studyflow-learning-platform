
<div class="w-full">
  <div class="mb-7 text-center">
    <div class="mx-auto mb-5 flex size-16 items-center justify-center rounded-2xl bg-primary text-3xl font-extrabold text-primary-foreground shadow-lg">
      S
    </div>

    <h1 class="text-3xl font-extrabold tracking-tight text-foreground">
      Create your account
    </h1>

    <p class="mt-2 text-sm text-muted">
      Start building your learning journey with StudyFlow.
    </p>
  </div>

  @if (errorMessage()) {
    <div role="alert"
         class="mb-5 rounded-xl border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger">
      {{ errorMessage() }}
    </div>
  }

  @if (successMessage()) {
    <div role="status"
         class="mb-5 rounded-xl border border-success/30 bg-success/10 px-4 py-3 text-sm text-success">
      {{ successMessage() }}
    </div>
  }

  <form (ngSubmit)="submitRegistration()" class="space-y-4">

    <div>
      <label for="name" class="mb-2 block text-sm font-semibold text-foreground">
        Full name
      </label>
      <input
        id="name"
        name="name"
        type="text"
        required
        maxlength="100"
        autocomplete="name"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        placeholder="Enter your full name"
        class="w-full rounded-xl border border-border bg-background px-4 py-3.5 text-sm text-foreground outline-none placeholder:text-muted focus:border-primary">
    </div>

    <div>
      <label for="email" class="mb-2 block text-sm font-semibold text-foreground">
        Email address
      </label>
      <input
        id="email"
        name="email"
        type="email"
        required
        maxlength="254"
        email
        autocomplete="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="you@example.com"
        class="w-full rounded-xl border border-border bg-background px-4 py-3.5 text-sm text-foreground outline-none placeholder:text-muted focus:border-primary">
    </div>

    <div>
      <label for="password" class="mb-2 block text-sm font-semibold text-foreground">
        Password
      </label>
      <div class="relative">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          required
          minlength="8"
          maxlength="72"
          autocomplete="new-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="Create a password"
          class="w-full rounded-xl border border-border bg-background px-4 py-3.5 pr-16 text-sm text-foreground outline-none placeholder:text-muted focus:border-primary">

        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold text-primary">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      <p class="mt-1.5 text-xs text-muted">Use 8–72 characters.</p>
    </div>

    <div>
      <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-foreground">
        Confirm password
      </label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        required
        autocomplete="new-password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        placeholder="Enter your password again"
        class="w-full rounded-xl border border-border bg-background px-4 py-3.5 text-sm text-foreground outline-none placeholder:text-muted focus:border-primary">
    </div>

    <button
      type="submit"
      [disabled]="loading() || !!successMessage()"
      class="sf-primary-button flex w-full items-center justify-center gap-2 py-3.5 disabled:cursor-not-allowed disabled:opacity-60">

      @if (loading()) {
        <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        Creating account...
      } @else {
        Create account →
      }
    </button>
  </form>

  <div class="my-7 flex items-center gap-4">
    <div class="h-px flex-1 bg-border"></div>
    <span class="text-xs text-muted">ALREADY REGISTERED?</span>
    <div class="h-px flex-1 bg-border"></div>
  </div>

  <p class="text-center text-sm text-muted">
    Already have an account?
    <a routerLink="/auth/login"
       class="font-bold text-primary hover:underline">
      Sign in
    </a>
  </p>
</div>
